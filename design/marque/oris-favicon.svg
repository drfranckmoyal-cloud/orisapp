<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Oris">
  <title>Oris — favicon</title>
  <!-- À 16 px, cinq barres se referment. Trois suffisent : deux cuspides et le
       sillon. Le même geste, réduit à ce qui reste lisible. -->
  <rect width="32" height="32" rx="7" fill="#14533B"/>
  <g fill="#F6F3EE">
    <rect x="7"  y="8"  width="5" height="17" rx="2.5"/>
    <rect x="13.5" y="12" width="5" height="9"  rx="2.5"/>
    <rect x="20" y="8"  width="5" height="17" rx="2.5"/>
  </g>
</svg>
