name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contrats et tokens à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/generate_contracts.py --check
      - run: python scripts/generate_tokens.py --check

  api:
    name: API (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oris
          POSTGRES_PASSWORD: oris
          POSTGRES_DB: oris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oris" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://oris:oris@localhost:5432/oris_test
      ORIS_TEST_DATABASE_URL: postgresql+psycopg://oris:oris@localhost:5432/oris_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      # Conversion du son des séances jouées : sur macOS c'est afconvert, ici ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: Contrat OpenAPI à jour
        run: python ../../scripts/export_openapi.py --check

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
